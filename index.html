<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Landscape Studio</title>
    <style>
        /* ЗАЩИТА: Запрет выделения контента */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: sans-serif;
            background-color: #0b0514; 
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        h1 {
            color: #ff0055; 
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
            margin-bottom: 5px;
            font-size: 2.5em;
            text-align: center;
        }

        .subtitle {
            color: #9d8cb3;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
        }
        
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px; /* Сделали шире под 3 карточки */
        
        }

        `css
           .card {
               background-color: #170d29;
               border-radius: 15px;
               overflow: hidden;
               border: 1px solid #3d1d66;
               box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
               padding: 25px;
               text-align: center;
               width: 100%;
               max-width: 450px; /* Ограничили ширину одной карточки */
               box-sizing: border-box;
               transition: 0.3s;
           }
        }

        .card:hover {
            border-color: #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        /* ЗАЩИТНЫЙ ФИЛЬТР: Размытие превью */
        .card img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            pointer-events: none;
            
            filter: blur(5px) contrast(1.2) brightness(0.9);
            image-rendering: pixelated;
            opacity: 0.8;
        }

        .card-title {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #f1ecf7;
        }

        .card-price {
            font-size: 28px;
            color: #bd00ff;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(189, 0, 255, 0.5);
        }

        .buy-btn {
            display: block;
            text-align: center;
            background-color: #ff0055;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
            font-size: 18px;
        }

        .buy-btn:hover {
            background-color: #d60048;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
        }
    </style>
</head>
<body>

    <h1>AI Cyber Landscape</h1>
    <p class="subtitle">Эксклюзивная цифровая живопись. Превью защищено размытием. Оригинал в высоком разрешении доступен к покупке.</p>


    <main class="gallery">
    
        <div class="card">
            <img src="images/art1.png" alt="Горный Закат ИИ">
            <h2 class="card-title">Горный Закат</h2>
            <div class="card-price">190 ₽</div>
            <a href="https://t.me/skalisss3?text=Привет!%20Хочу%20купить%20картину%20Горный%20Закат" target="_blank" class="buy-btn">Купить оригинал</a>
        </div>
    
        <div class="card">
            <img src="images/art2.png?v=3" alt="Золотой табун ИИ">
            <h2 class="card-title"> Вечер над долиной</h2>
            <div class="card-price">200 ₽</div>
            <a href="https://t.me/skaliss3?text=Привет!%20Хочу%20купить%20картину%20Долина" target="_blank" class="buy-btn">Купить оригинал</a>
        </div>
    
        <div class="card">
            <img src="images/art3.png?v=3" alt="Под цветущими ветвями ИИ">
            <h2 class="card-title">Под цветущими ветвями</h2>
            <div class="card-price">160 ₽</div>
            <a href="https://t.me/skaliss3?text=Привет!%20Хочу%20купить%20картину%20Золотой%20вечер%20в%20саду" target="_blank" class="buy-btn">Купить оригинал</a>
        </div>
        
        <div class="card">
           <img src="images/sunset.jpg" alt="Зимний закат ИИ">
           <h2 class="card-title">Зима</h2>
           <div class="card-price">150 ₽</div>
           <a href="https://t.me/skaliss3?text=Привет!%20Хочу%20купить%20картину%20Зимний%20закат" target="_blank" class="buy-btn">Купить оригинал</a>
        </div>
    
    </main>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.keyCode === 83  e.keyCode === 85)  e.keyCode === 123) {
                e.preventDefault();
            
        });
    </script>

</body>
</html>
